# The open-questions file is the design's own statement of uncertainty.
# A resolved question is deleted and later ids keep their numbers, so gaps
# mean progress and earlier maps stay true.
# Reviewers aim here first. An open question on irreversible surface blocks
# the signature until it is researched down. Entries sort with the blocking
# ones first.

- id: Q-5
  statement: Who pays for a keyless holder's production submission. The Ethereum Foundation ranks sponsorship a product improvement rather than a demo requirement and rules out any kit-run relayer, so the demo carries no named payer while production still owes one for the exact user the kit targets. The salted commitments mean a sponsor cannot rate-limit by identity, only simulate a request before paying, so an open paymaster filtering by simulation is the leading candidate rail. That rail has one limit of its own. Simulation filters an invalid request but never a race, since an attempt opening first or an edit landing between simulation and inclusion makes the sponsored operation revert at the sponsor's cost, and it never filters a hostile method whose verdict depends on state another contract flips after the simulation, which burns the sponsor's gas at will. Simulation also hands the sponsor the cleartext request, the setup body and the used credentials, a disclosure to a named off-chain party that fires even for a request the sponsor then declines, so the rail trades the holder's confidentiality for spam resistance, the same disclosure the design accepts at a recovery's submission. A bound in the contract itself was considered and rejected, the shape Argent's account takes with a capped fee and one escape per role per twelve hours. It buys nothing here, since one attempt runs at a time per action, every proof a request carries is paid for by whoever submits it, and a sponsor simulates before paying. The payment order the request carries repays a sponsor from the account at the handover's execution, days after the sponsored submission and only if the recovery lands, so every attempt cancelled inside its wait leaves the sponsor unpaid, an exposure the rail prices or refuses. One concern stands recorded, that the kit's declared audience is exactly the user with no funded key, so a flow whose last step assumes an unnamed payer stays unfinished for that audience until production names one, a gap accepted for the showcase that must not silently become permanent.
  surface: reversible
  modules: [policy-manager]
  blocking: false
  resolution: Design the production rail and its anti-spam bound after the showcase, showing a keyless holder completes a recovery with a named payer. The shape the rail has to fit is already fixed, since every proof signs the payee and the amount, so a sponsor who arrives after the gathering is repaid only if the request named them, and the rail is designed around that rather than against it. A request may also leave the payee open, which repays the execution and never the opening, so the rail still owes the opening's payer.

- id: Q-8
  statement: The integrator surface carries more than the design can check. The setup screen carries the disclosures the design depends on, which are the single point of failure warning, the shared failure warning, the adopt-at-your-own-risk label, the identity demonstration label, each privacy level's reveal, the backup trade, the wait default whose span is the holder's whole notice window, the self-attested nature of every declaration of trusted parties, one exact origin kept for passkey enrollment and assertion since the relying-party hash binds a domain family rather than a page, a contract guardian's own wallet as a party that credential trusts, the committed action and its author as the party holding the account's authority, the kit's audited actions offered alone with the action's supportsAccount checked before commit, a waiting attempt shown beside a key that works again, a re-authorization of the action shown as releasing any attempt that ran its wait out while the action was off, the rule width the screen refuses beyond priced from the methods a rule names rather than from a count of credentials, a warning on a committed wait below a stated span, the effect of a mandatory single-credential clause on the cancel by proofs, the re-commit the holder owes after a recovery, each named method's paused state read before arming, what the holder's own pause choice means for them stated in words rather than by naming the mechanism. I-15, that the holder sees who could act on their account before approving, is the one invariant checked human-only. The same surface carries the kit's off-server dependencies by scope, the gathering transport, the helper contact book, the fresh device's account discovery, the manager's own address which no event of the kit or of the account publishes, and the alerting, all integrator-built since the kit operates no server. The helper's approval screen belongs on the same surface, and it carries the destination disclosure for every method, since a guardian's wallet renders the outcome payload only as opaque bytes, whose layout is the committed action's own, and a passkey or an identity helper signs a digest that renders nothing, so an integrator that shows the wrong key lets a phisher name their own and honest helpers approve it unseen, the handover being public rather than hidden but the rendering being nobody's enforced duty. The demo integration in the Ambire-fork extension is this engagement's to build, yet a third-party wallet writing its own setup or approval UI can break every item with nothing in the repo able to notice. Listing the account's other privilege entries, its extra doors and code entries, is the wallet's and not the SDK's.
  surface: irreversible
  modules: [sdk]
  blocking: true
  resolution: Decide what the contracts enforce against what the integrator UI must render, the holder's setup disclosures and the helper's approval-destination disclosure alike, either moving those renders onto a surface the kit controls or stating the integrator obligation as a conformance requirement the SDK checks.
  waiver:
    by: "@0xParti"
    date: 2026-09-07
    reason: What the screens render is the sdk and ux chapters' duty, answered on the sdk chapter's own pull request before the signature rather than on the contracts chapter's. The question's own last sentence, a third-party wallet writing its own screens, is not answered by that deferral and stays open there, since one of the two branches this question offered is already spent. The contracts chapter forecloses moving the render onto a surface the kit controls, so the branch left is a conformance requirement the SDK checks, which reaches an integrator who runs the SDK and not a phisher who does not.

- id: Q-13
  statement: Watching is permissionless, any indexer can read the recovery events and notify, so the watcher is a role rather than a privileged service, the kit building no watcher and running no operator, only the events any watcher needs, the Ethereum Foundation having ruled out kit-run relayers and APIs. What stays undesigned is where a holder's alert actually comes from, since the channel binding can live neither on chain nor in kit storage, leaving the integrator's infrastructure or the holder's own client. A method its pause holder stopped has no derivable audience among holders who merely named it, since I-16 hides which accounts name a method, so only a client holding the holder's configuration can route that alert. The holders with a live attempt through that method are the exception, since the manager stores and publishes the methods each accepted set used, so a watcher routes to them by account from the events alone. The missing alert channel costs more here than elsewhere, since the kit puts no floor under the holder's chosen wait, so noticing inside that wait depends entirely on whatever alerting the integrator provides.
  surface: reversible
  modules: [watcher, policy-manager]
  blocking: false
  resolution: Specify the events a watcher consumes and the integrator's alerting obligation in the tech design, the watcher built by the integrator rather than the kit, stating on the setup screen that alerts are a live dependency the holder relies on.

- id: Q-15
  statement: A smart account can exist at the same address on many chains, while the binding digest binds one chain id, so a recovery disarms the lost key only on the chain it ran on. The Ethereum Foundation confirmed the single-chain mainnet design with the demo on Sepolia, multi-chain support waiting on a protocol change, an EIP enabling L2 state reads from L1. What production does about the same address on other chains, one chain as the root of authority with the others following over bridges, or a separate setup and recovery per chain, stays deferred.
  surface: reversible
  modules: [policy-manager, action]
  blocking: false
  resolution: Revisit for production once the multi-chain EIP lands. A root chain with bridged effects is the named candidate direction, decided before any multichain deployment rather than before the showcase. Nothing in the contract stores a chain id today, since the digest's domain already binds one and a contract reads its own chain, so the field a multi-chain design would add names the chain an outcome applies to and belongs on the request rather than on the stored attempt.

- id: Q-22
  statement: Whether the two identity methods work for a legitimate user at the showcase. AnonAadhaar's pinned production key is the identity authority's 2021 certificate and the authority has rotated since, so credentials signed under the current key fail verification and the candidate fix is unmerged, verified against the sources on 2026-08-19. zkPassport rests on a certificate root its project rotates and on document support that varies by country, and no public security audit of either stack was found. Whether the same person's renewed document reproduces the identity commitment either stack derives is unanswered for both, so a credential of one of them may stop matching its holder after a renewal with nothing in the kit able to see it. The design ships both as secondary methods whose weaknesses are the adopting holder's informed choice, and the setup screen discourages a method whose findings stand unfixed. What is undecided is who re-checks that state, on what date, and what the setup screen says if the answer is that a real credential still does not verify.
  surface: reversible
  modules: [method-aadhaar, method-zkpassport, sdk]
  blocking: false
  resolution: Name the party and the date of the re-check before the showcase, and fix what the setup screen says for a method that fails it. The surface is reversible because a method is replaceable and a rule that names it can be re-committed by a holder with a key.

- id: Q-24
  statement: Whether the opt-out from a method's stop should be one choice per method rather than one per setup. The flag in the setup body is one bool for the whole setup, read at all four places the manager reads a stop, and the two methods that carry a pause in this deployment answer to one holder, so a per-method choice would ask the holder to tell two stops of the same party apart. The case for a per-method choice is a deployment whose methods answer to different holders, a third-party method with an owner of its own or an adopted ERC-7913 verifier whose paused view has one, where a holder could honour the Foundation's stop and ignore another's. That form costs a list of methods in the body instead of the bool, its copy onto the attempt, a membership check at the four reads, and one disclosure per method on the setup screen.
  surface: reversible
  modules: [policy-manager, sdk]
  blocking: false
  resolution: Keep the flag per setup for this deployment and decide the per-method form when a deployment carries methods under different pause holders. The surface is reversible because the body layout is fixed per deployment and a later deployment carries its own.
