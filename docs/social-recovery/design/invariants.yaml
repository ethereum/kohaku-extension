- id: I-35
  heuristic: the wallet never leaves a setup and its authorization out of step
  statement: The wallet never commits a setup without writing the action's authorization in the same batch, and never removes one of the two alone while the other stands.
  bug_class: dormant setup revived under a forgotten rule
  modules: [ux/setup, ux/management]
  check: human-only            # awaiting persona-replay against design/personas/P-5-bob.md
  check_ref: pending
  status: grounded
