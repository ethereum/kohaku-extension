- id: I-36
  heuristic: nobody starts a recovery without first reading that no support agent ever asks for one
  statement: Every entry into a recovery, the recover door on the welcome screen and the recover an account entry in settings, renders the warning that no support agent ever asks a holder to start a recovery, acknowledged as nobody claiming to be support asked me to do this, and so do the extension's password reset and seed import entries. No entry accepts any input before the holder acknowledges that warning.
  bug_class: a support scam walking a holder into a recovery
  modules: [ux/onboarding, ux/recovery, ux/management]
  check: human-only            # the strings check pins the warning and its acknowledgment through its rule 6; the gate on any input stays human, awaiting persona-replay against design/personas/P-1-sam.md and design/personas/P-5-bob.md
  check_ref: pending
  status: grounded
  source: D-316
  derived_from: []

- id: I-37
  heuristic: before saving, the holder sees which parties their setup will trust, and which methods name none
  statement: The review renders, for every method in the path, the parties its declaration names, the words audited, with no outside party for a kit method whose declaration is empty, the party that declaration names as able to stop the method, or the words that nobody can stop it where the declaration names none, or the words unknown outside parties for a module with no declaration. It renders the committed action with its author and each method's stop state, and the key a recovery would remove, read from the account's own privilege stream, with the save disabled while that key cannot be read. For every guardian address it renders the sentence that, if the address is a smart account, whoever controls it can approve for it, whatever a test returned, since no screen marks an address as the holder's own key. The save action stays disabled until each of those has rendered, and a read that fails leaves it disabled with that reason.
  bug_class: hidden trust, a holder committing to a party they never saw
  modules: [ux/setup, ux/management]
  check: human-only            # awaiting persona-replay against design/personas/P-3-carl.md
  check_ref: pending
  status: grounded
  source: D-317
  derived_from: []

- id: I-38
  heuristic: an approval never outlives the recovery it was gathered for
  statement: The wallet deletes every approval it stored, and the attempt id it predicted, once it has submitted them or once the recovery that gathered them can no longer complete, because the deadline passed, another attempt opened, the setup changed, the recoverer abandoned, the account's own key cancelled the attempt, a set of approvals signed for cancel ended it, anyone ended it while a method it used was stopped, or the attempt can no longer execute; a pause by itself wipes nothing. After a submission the countdown's record is the chain's attempt read, which returns the id, D-371, since the manager publishes the id on chain and the approvals are the proof material, D-310. It keeps one line of reason and nothing else, so no approval survives on the device past that moment.
  bug_class: stale approval reuse, proof material left on a device
  modules: [ux/recovery]
  check: human-only            # awaiting persona-replay against design/personas/P-2-alice.md
  check_ref: pending
  status: grounded
  source: D-310
  derived_from: []

- id: I-39
  heuristic: a page a phisher wrote cannot vouch for itself, so the guardian's check is the call they place
  statement: Every surface that asks a guardian to approve instructs a call to the owner on a phone number the guardian already had, never a number the link's sender supplied, and its sign action stays disabled until the guardian acknowledges that call or that they are the owner. A call the guardian received never answers that check, and every such surface says so, since a phisher who calls first performs the ritual in the other direction. That call compares two values, the account being recovered and the new key, which both parties read aloud from their own screens. The recoverer's checklist asks the guardian to place that call rather than placing it for them, and instructs the recoverer to read the two values when the guardian calls.
  bug_class: phished approval, a guardian signing a key the owner never named
  modules: [ux/guardian-page, ux/recovery]
  check: human-only            # awaiting persona-replay against design/personas/P-6-sara.md
  check_ref: pending
  status: grounded
  source: D-308
  derived_from: []

- id: I-40
  heuristic: nobody signs an approval whose deadline they were never shown
  statement: Every surface that asks for an approval or receives one renders the request's deadline before the guardian gives it, with the sentence that anyone holding the request can submit it until that deadline passes.
  bug_class: unbounded exposure, an approval submitted after the guardian believed it had lapsed
  modules: [ux/guardian-page, ux/recovery]
  check: human-only            # the strings check's rule 6 pins the submittable sentence on the frames that carry it today; which surfaces must carry it stays human, awaiting persona-replay against design/personas/P-6-sara.md
  check_ref: pending
  status: grounded
  source: D-392
  derived_from: []

- id: I-41
  heuristic: a name is what somebody bought, the address is what the reader checks
  statement: Wherever a resolved name stands beside a full address the screen asks the reader to check, the screen states that the name can change hands and that the full address is what to check. Wherever a resolved name renders alone for an address the reader is asked to act on, the same caveat renders beside it.
  bug_class: a bought name read in place of the address it stands beside
  modules: [ux/setup, ux/recovery, ux/guardian-page, ux/management, ux/watcher, ux/cancel]
  check: human-only            # the strings check's rule 4 holds the first sentence; a name rendered with no address stays human until the check learns that case, awaiting the copy-lint that runs it in the battery
  check_ref: pending
  status: grounded
  source: D-302
  derived_from: []

- id: I-42
  heuristic: the one repair that would complete a hostile recovery is refused while that recovery runs
  statement: While an attempt is open on the account, the management surface refuses the re-authorize write and states why it refuses. No surface sends that write, or offers it as an action, while that attempt is open.
  bug_class: an account handed over by a repair the holder took during an attempt
  modules: [ux/management]
  check: human-only            # the strings check's rule 6 pins the refusal sentence on the overview frame that draws it; the control's absence stays human, awaiting persona-replay against design/personas/P-5-bob.md
  check_ref: pending
  status: grounded
  source: D-309
  derived_from: []

- id: I-43
  heuristic: a recovery installs a key the wallet already holds, never an address somebody typed
  statement: Every key a recovery installs is a key the wallet's keystore holds or derives from a seed entry it holds, whether the fast track wrote that entry or the holder created or imported it through the ordinary doors. No recovery surface takes a pasted destination address. The extension enforces this itself, checking the candidate against its own keystore before it hands the handover to the request builder, since the keystore is the wallet's and the SDK holds none. The SDK checks only that the candidate address matches the public key supplied with it, and it warns rather than refuses where no certification came with the candidate, so no sdk member enforces this axiom.
  bug_class: a support scam pointing a recovery at the scammer's own address
  modules: [ux/onboarding, ux/recovery]
  check: human-only            # awaiting persona-replay against design/personas/P-1-sam.md
  check_ref: pending
  status: grounded
  source: D-312
  derived_from: []

- id: I-44
  heuristic: a submission publishes the fewest members the rule needs and no more
  statement: On a setup that keeps stops in force the submission leaves out the proofs of every method whose stop is on when the request is built, and on a setup that ignores stops it leaves nothing out for a stop, since the policy manager reads no stop for that holder, contracts D-111. It carries the smallest set of claims that satisfies the rule from what remains. Among equally small sets it carries the one naming the fewest methods that carry a stop, which `ux-interfaces.md` D-373 states for the builder. Every row outside that set reads not needed, whether or not it already holds a claim, and the wallet leaves every claim outside that set out of the submission.
  bug_class: a member set published permanently that the rule never needed, and a foreign method's stop in front of the spend
  modules: [ux/recovery]
  check: human-only            # awaiting persona-replay against design/personas/P-2-alice.md
  check_ref: pending
  status: grounded
  source: D-392
  derived_from: []

- id: I-45
  heuristic: a stopped recovery reads as stopped, with the clock it still runs on and the party who may end it
  statement: A stopped attempt renders as stopped with its fixed end, and its countdown keeps counting to that end rather than freezing. A stopped row at the recoverer's readout renders as stopped. Every surface that renders a stopped attempt states that anyone may end that attempt while the stop holds, the rule the requirement row D-395 rests on, and a stopped row rendered where the manager has accepted no attempt carries no such sentence, since there is no attempt for anyone to end. What each method the path names declares decides whether the sentence that anyone may end the attempt renders, never the family that method belongs to, since a third-party module decides for itself whether it carries a pause.
  bug_class: a stop read as a frozen countdown, or an attempt anyone can end with nobody told
  modules: [ux/recovery, ux/watcher, ux/cancel, ux/management]
  check: human-only            # awaiting persona-replay against design/personas/P-4-diana.md
  check_ref: pending
  status: grounded
  source: D-392
  derived_from: []

- id: I-46
  heuristic: the wallet never saves a wait shorter than the time a keyless holder needs to notice
  statement: The wallet refuses a waiting period shorter than 24 hours, at the picker's chips and at its custom entry alike, and it states that floor as its own rule, the attribution I-24 holds.
  bug_class: a hostile recovery that executes before the holder opens the wallet
  modules: [ux/setup, ux/management]
  check: human-only            # awaiting persona-replay against design/personas/P-2-alice.md
  check_ref: pending
  status: grounded
  source: D-305
  derived_from: [I-24]

- id: I-47
  heuristic: a screen never points at a rescue the holder's own rule cannot deliver
  statement: The sentence the banner generates about who may end a running attempt names only the roads the holder's saved rule carries and the live stop states allow. It never names a road that rule lacks, and while a stop holds on a method the attempt used, on a setup that keeps stops in force, it never says that only the account's own key may end the attempt, since anyone may end it then. On a setup that ignores stops no stop holds on the attempt, and the banner never says that anyone may end it. What each method the path names declares decides whether the banner names the road that anyone may end the attempt, never the family that method belongs to, since a third-party module decides for itself whether it carries a pause. A rule with no cancelling set therefore reads that only this account's own key can cancel the recovery, and the word guardians never renders on a path without a guardian row.
  bug_class: a holder waiting for a rescue that cannot arrive, or spending a key they did not have to spend
  modules: [ux/cancel, ux/watcher, ux/recovery, ux/management]
  check: human-only            # awaiting persona-replay against design/personas/P-5-bob.md
  check_ref: pending
  status: grounded
  source: D-307
  derived_from: [I-45]

- id: I-48
  heuristic: the one window where the account and the destination key are not yet public is not forwarded away, and the install a message asks for names its source
  statement: Every surface that hands an approval link to somebody, the recoverer's message, the phone hand-off step and the page the link opens, states that the link reveals the account being recovered and the new key, and that it is not to be forwarded. The same message names the source the extension is installed from and the publisher to check there, since a guardian who searches for it instead installs whatever a phisher listed.
  bug_class: an account and a destination key published to strangers before the chain publishes them, or handed to an extension a phisher listed
  modules: [ux/recovery, ux/guardian-page]
  check: human-only            # awaiting persona-replay against design/personas/P-6-sara.md
  check_ref: pending
  status: grounded
  source: D-392
  derived_from: []
